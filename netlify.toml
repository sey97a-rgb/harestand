[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/ogp.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "http://harestand.com/*"
  to = "https://harestand.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.harestand.com/*"
  to = "https://harestand.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/build/*"
  to = "/404.html"
  status = 404
